<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Juiced Pixels Demo Page</title>
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;700&display=swap" rel="stylesheet">
    <style>
      html {
        font-size: 18px;
      }
      body {
        font-family: 'Raleway', sans-serif;
        margin: 0;
        padding: 0;
        background: #f8f9fa;
        color: #222;
      }
      main {
        max-width: 500px;
        margin: 4rem auto;
        background: #fff;
        border-radius: 10px;
        box-shadow: 0 2px 12px rgba(0,0,0,0.07);
        padding: 2rem;
        text-align: center;
      }
      h1 {
        font-size: 2rem;
        margin-bottom: 1.2rem;
        font-weight: 700;
        color: #007acc;
      }
      details {
        margin-top: 2rem;
        font-size: 1.1rem;
        background: #e3f2fd;
        border-radius: 6px;
        padding: 1em;
        box-shadow: 0 1px 4px rgba(0,0,0,0.04);
        display: inline-block;
      }
      summary {
        font-weight: 700;
        cursor: pointer;
        color: #388e3c;
      }
      #punchline {
        margin-top: 1em;
        color: #d32f2f;
        font-weight: 700;
      }
    </style>
</head>
<body>
  <main>
    <h1>Juiced Pixels Demo Page</h1>
    <details id="joke">
      <summary>When do you start on red and stop on green?</summary>
      <p id="punchline">When you're eating a watermelon!</p>
    </details>
  </main>
</body>
</html>
