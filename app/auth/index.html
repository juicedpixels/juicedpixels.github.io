<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Juiced Pixels Auth Demo Page</title>
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
    <script src="../scripts/auth.js"></script>
    <link rel="stylesheet" href="../common.css">
</head>
<body>
  <main style="max-width:400px; margin:3rem auto; background:#fff; border-radius:10px; box-shadow:0 2px 12px rgba(0,0,0,0.07); padding:2rem; border:1.5px solid #bbdefb; text-align:center;">
    <h1 style="color:#007acc; font-weight:700; margin-bottom:2rem;">Juiced Pixels Auth Demo Page</h1>
    <div id="welcome" style="margin-bottom:1.5em; font-size:1.1em;">Hello Please Sign In</div>
    <div id="auth" style="margin-bottom:1.5em;">
      <label for="firstname" style="display:block; margin-bottom:0.3em; font-weight:700;">First Name</label>
      <input id="firstname" style="width:90%; padding:0.5em; margin-bottom:1em; border-radius:5px; border:1px solid #bbdefb;">
      <label for="surname" style="display:block; margin-bottom:0.3em; font-weight:700;">Surname</label>
      <input id="surname" style="width:90%; padding:0.5em; margin-bottom:1em; border-radius:5px; border:1px solid #bbdefb;">
      <button id="ok" style="background-color:#007acc; color:white; border:none; border-radius:4px; padding:0.7em 1.5em; font-weight:700; cursor:pointer; margin-top:0.5em;">OK</button>
    </div>
    <div style="margin-bottom:1.5em; font-size:1.05em;">This page uses Cookies 🍪</div>
    <a id="homelink" href="../index.html" style="display:inline-block; margin-top:1em; padding:0.7em 1.5em; background:#e3f2fd; color:#007acc; border-radius:6px; text-decoration:none; font-weight:700; box-shadow:0 1px 4px rgba(0,0,0,0.04); transition:background 0.2s;">Go Home</a>
  </main>
</body>
</html>
