<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WebDriverJs Demo Page</title>
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;700&display=swap" rel="stylesheet">
    <style>
      html {
        font-size: 18px;
      }
      body {
        font-family: 'Raleway', sans-serif;
        margin: 0;
        padding: 0;
        background: #f8f9fa;
        color: #222;
      }
      h1 {
        text-align: center;
        font-size: 2rem;
        margin-top: 2rem;
        margin-bottom: 1.5rem;
        font-weight: 700;
        color: #007acc;
      }
      h2 {
        font-size: 1.2rem;
        margin-top: 1.5em;
        margin-bottom: 0.5em;
        color: #333;
        font-weight: 700;
      }
      #textelements span {
        display: inline-block;
        background: #e3f2fd;
        color: #007acc;
        border-radius: 5px;
        padding: 0.4em 1em;
        margin: 0.2em;
        cursor: pointer;
        font-weight: 700;
        transition: background 0.2s;
      }
      #textelements span:hover {
        background: #bbdefb;
      }
      #result {
        margin-top: 1em;
        font-size: 1.1em;
        color: #388e3c;
        font-weight: 700;
      }
      div[id^="element"] {
        background: #fff;
        border: 1px solid #ddd;
        border-radius: 5px;
        padding: 0.7em 1em;
        margin-bottom: 0.5em;
        min-height: 2em;
        box-shadow: 0 1px 4px rgba(0,0,0,0.04);
      }
      main {
        max-width: 600px;
        margin: 2rem auto;
        background: #fff;
        border-radius: 10px;
        box-shadow: 0 2px 12px rgba(0,0,0,0.07);
        padding: 2rem;
      }
    </style>
    <script src="scripts/script.js"></script>
</head>
<body>
  <main>
    <h1>WebDriverJs Demo Page</h1>
    <h2>Child element appears after 2 seconds</h2>
    <div id="elementappearsparent"></div>
    <h2>Child element appears after page load</h2>
    <div id="elementappearsafterpage"></div>
    <h2>Child element disappears after 3 seconds</h2>
    <div id="elementdisappears">Here one minute, then...</div>
    <h2>Element changes text (from old to new) after 4 seconds</h2>
    <div id="elementchangestext">old</div>
    <h2>A bunch of elements with different text</h2>
    <div id="textelements">
      <span onclick="spanClicked('Rock')">Rock</span>
      <span onclick="spanClicked('Paper')">Paper</span>
      <span onclick="spanClicked('Scissors')">Scissors</span>
    </div>
    <h2>Result</h2>
    <div id="result"></div>
  </main>
</body>
</html>
